<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Costra tools · make a user entry</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0D2443; --orange:#ED744B; --bg:#F8F8F8; --ink:#1B1B1B; --muted:#5B6470; --line:#E3E6EA }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Inter,system-ui,sans-serif }
  .card { max-width:560px; margin:8vh auto; background:#fff; border:1px solid var(--line); border-radius:12px; padding:26px }
  h1 { font:600 20px Poppins,sans-serif; color:var(--navy); margin:0 0 4px } p { color:var(--muted); margin:0 0 14px }
  label { display:block; font-weight:500; margin:12px 0 4px } input { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit }
  button { margin-top:16px; background:var(--orange); color:#fff; border:0; border-radius:8px; padding:10px 16px; font:500 15px Inter; cursor:pointer }
  pre { background:#F1F3F5; border-radius:8px; padding:12px; white-space:pre-wrap; word-break:break-all; font-size:12px; margin-top:16px }
  .ok { color:#127A45 } .err { color:#B42318 } small { color:var(--muted) }
</style></head><body>
<div class="card">
  <h1>Make a user entry</h1>
  <p>Runs entirely in your browser — nothing is sent anywhere. Copy the line into <code>AUTH_USERS</code> in Vercel (both Costra apps), comma‑separated for several users, then redeploy.</p>
  <label>Email</label><input id="email" type="email" autocomplete="off" placeholder="name@costra.io">
  <label>Password <small>(min 12 characters)</small></label><input id="pw" type="password" autocomplete="new-password">
  <label>Password valid until</label><input id="exp" type="date">
  <button id="go">Make entry</button>
  <pre id="out" hidden></pre>
</div>
<script>
const ITER = 600000; // keep equal to PBKDF2_ITER in lib/auth.js
const d = new Date(); d.setDate(d.getDate() + 90); document.getElementById("exp").value = d.toISOString().slice(0, 10);
const hex = (buf) => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
document.getElementById("go").onclick = async () => {
  const out = document.getElementById("out"); out.hidden = false; out.className = "";
  const email = document.getElementById("email").value.trim().toLowerCase(), pw = document.getElementById("pw").value, exp = document.getElementById("exp").value;
  if (!email.includes("@")) { out.className = "err"; out.textContent = "Enter an email."; return; }
  if (pw.length < 12) { out.className = "err"; out.textContent = "Password too short — at least 12 characters."; return; }
  out.textContent = "Hashing (600 000 iterations)…";
  const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFKC")), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode(salt), iterations: ITER }, key, 256);
  out.className = "ok"; out.textContent = `${email}:${salt}:${hex(bits)}:${exp}`;
  document.getElementById("pw").value = "";
};
</script></body></html>
